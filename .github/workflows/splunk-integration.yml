name: Splunk integration test

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:
    inputs:
      accept_terms:
        description: I accept the Splunk General Terms for this disposable instance
        required: true
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - .github/workflows/splunk-integration.yml
      - scripts/test_splunk_container.sh
      - scripts/*splunk*.py
      - config/splunk-command-fields.json
      - tests/baselines/collect-windows.ps1
      - rules/windows/proc_creation_encoded_powershell.yml

permissions:
  contents: read

jobs:
  capture-clock:
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_dispatch' && inputs.accept_terms) ||
      (github.repository == 'sfazliddinov385/DriftGuard' &&
      contains(fromJSON('["push","schedule"]'), github.event_name)))
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Read the clock two ways and collect Windows Security event 4688
        shell: pwsh
        run: ./tests/baselines/collect-windows.ps1 -ClockDemo -OutputPath reports/windows-clock.json
      - uses: actions/upload-artifact@v4
        with:
          name: windows-clock
          path: reports/windows-clock.json
          overwrite: true
          if-no-files-found: error
          retention-days: 14
  check:
    concurrency:
      group: driftguard-managed-splunk
      cancel-in-progress: false
    needs: capture-clock
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: windows-clock
          path: reports/clock-input
      - name: Verify the replay and the scheduled alerts on fresh Windows events
        run: bash scripts/test_splunk_container.sh reports/clock-input/windows-clock.json
      - name: Save the counts and event IDs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: splunk-replay-results
          path: reports/splunk-integration/*.json
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: managed-canary
          path: reports/splunk-canary.json
          if-no-files-found: ignore
          retention-days: 14

  review:
    needs: check
    if: failure() && needs.check.result == 'failure' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: driftguard-splunk-review
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: managed-canary
          path: reports
      - name: Open a draft only for a verified Splunk repair
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_GATEWAY_ID: ${{ secrets.CLOUDFLARE_GATEWAY_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python scripts/review_splunk_drift.py

  notify:
    needs: [capture-clock, check, review]
    if: >-
      always() && !cancelled() && needs.capture-clock.result != 'skipped' &&
      (failure() || (github.event_name == 'push' && needs.check.result == 'success'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Send the result to Slack when configured
        env:
          DRIFTGUARD_WEBHOOK_URL: ${{ secrets.DRIFTGUARD_WEBHOOK_URL }}
          CHECK: ${{ needs.check.result }}
          REVIEW: ${{ needs.review.result }}
        run: |
          if [ -z "$DRIFTGUARD_WEBHOOK_URL" ]; then
            echo "Slack delivery pending webhook configuration." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$CHECK" = success ]; then
            python scripts/notify_slack.py recovered
          elif [ "$REVIEW" = success ]; then
            python scripts/notify_slack.py drift
          else
            python scripts/notify_slack.py error
          fi
