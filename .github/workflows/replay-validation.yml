name: DriftGuard Replay Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  validate-and-replay:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Sigma rules
        run: sigma check --fail-on-issues rules/

      - name: Compile Sigma rules to Splunk SPL
        run: sigma convert -t splunk -p splunk_windows rules/

      - name: Run Healer Guardrail Unit Tests
        run: pytest -q

      - name: Run Multi-Rule Log Replay Suite
        id: replay
        continue-on-error: true
        run: python scripts/run_replay_suite.py --failed-out reports/failed_rules.txt

      - name: Run Cloudflare Workers AI Drift Healer
        if: steps.replay.outcome == 'failure' && !startsWith(github.head_ref, 'driftguard/heal-')
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_GATEWAY_ID: ${{ secrets.CLOUDFLARE_GATEWAY_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          rm -f reports/drift_fix_summary.md
          FIRST=1
          while IFS= read -r RULE_PATH; do
            [ -z "$RULE_PATH" ] && continue
            if [ "$FIRST" -eq 1 ]; then
              python scripts/ai_healer.py --rule "$RULE_PATH"
              FIRST=0
            else
              python scripts/ai_healer.py --rule "$RULE_PATH" --append-summary
            fi
          done < reports/failed_rules.txt

      - name: Open Draft PR with Verified Sigma Patch
        if: steps.replay.outcome == 'failure' && !startsWith(github.head_ref, 'driftguard/heal-')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="driftguard/heal-${{ github.run_id }}"
          git config user.name "DriftGuard Bot"
          git config user.email "driftguard-bot@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add rules/
          git commit -m "fix(drift): auto-healed drifted Sigma detection rule(s)"
          git push origin "$BRANCH"
          gh pr create \
            --draft \
            --base main \
            --head "$BRANCH" \
            --title "DriftGuard AI Fix: Repair drifted Sigma detection(s)" \
            --body-file reports/drift_fix_summary.md

      - name: Enforce original validation status
        if: steps.replay.outcome == 'failure'
        run: |
          echo "One or more rules failed replay validation. Review the DriftGuard Draft PR to heal them."
          exit 1