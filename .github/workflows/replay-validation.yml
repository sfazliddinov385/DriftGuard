name: DriftGuard Replay Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  validate-and-replay:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Sigma rules
        id: sigma
        run: sigma check --fail-on-issues rules/

      - name: Compile Sigma rules to Splunk SPL
        id: splunk
        run: python scripts/compile_queries.py

      - name: Run automated tests
        id: pytest
        run: pytest -q

      - name: Run Multi-Rule Log Replay Suite
        id: replay
        continue-on-error: true
        run: |
          if python scripts/run_replay_suite.py --json-out reports/replay.json; then
            exit 0
          fi
          jq -r '.rules[] | select(.status == "fail") | .rule_path' reports/replay.json > reports/failed_rules.txt
          if [ -s reports/failed_rules.txt ]; then
            echo "has_drift=true" >> "$GITHUB_OUTPUT"
          fi
          exit 1

      - name: Run Cloudflare Workers AI Drift Healer
        id: healer
        if: steps.replay.outputs.has_drift == 'true' && !startsWith(github.head_ref, 'driftguard/heal-')
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_GATEWAY_ID: ${{ secrets.CLOUDFLARE_GATEWAY_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          rm -f reports/drift_fix_summary.md
          FIRST=1
          while IFS= read -r RULE_PATH; do
            [ -z "$RULE_PATH" ] && continue
            if [ "$FIRST" -eq 1 ]; then
              python scripts/ai_healer.py --rule "$RULE_PATH"
              FIRST=0
            else
              python scripts/ai_healer.py --rule "$RULE_PATH" --append-summary
            fi
          done < reports/failed_rules.txt

      - name: Open Draft PR with Verified Sigma Patch
        id: draft_pr
        if: steps.replay.outputs.has_drift == 'true' && !startsWith(github.head_ref, 'driftguard/heal-')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="driftguard/heal-${{ github.run_id }}"
          git config user.name "DriftGuard Bot"
          git config user.email "driftguard-bot@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add rules/
          git commit -m "fix(drift): auto-healed drifted Sigma detection rule(s)"
          git push origin "$BRANCH"
          gh pr create \
            --draft \
            --base main \
            --head "$BRANCH" \
            --title "DriftGuard AI Fix: Repair drifted Sigma detection(s)" \
            --body-file reports/drift_fix_summary.md

      - name: Notify Slack about a missed replay
        if: always() && steps.replay.outputs.has_drift == 'true' && github.ref == 'refs/heads/main'
        env:
          DRIFTGUARD_WEBHOOK_URL: ${{ secrets.DRIFTGUARD_WEBHOOK_URL }}
        run: |
          if [ -n "$DRIFTGUARD_WEBHOOK_URL" ]; then
            python scripts/notify_slack.py drift
          else
            echo "Slack delivery pending webhook configuration." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Enforce original validation status
        if: steps.replay.outcome == 'failure'
        run: |
          echo "One or more rules failed replay validation. Review the DriftGuard Draft PR to heal them."
          exit 1

      - name: Measure matches on normal Windows activity
        id: baseline
        run: python scripts/check_benign_baseline.py --input tests/baselines/windows-processes.json --json-out reports/benign-baseline.json

      - name: Prepare public dashboard
        id: dashboard_data
        if: ${{ !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && !github.event.repository.fork }}
        env:
          JOB_STATUS: ${{ job.status }}
          CHECK_SIGMA: ${{ steps.sigma.outcome }}
          CHECK_SPLUNK: ${{ steps.splunk.outcome }}
          CHECK_PYTEST: ${{ steps.pytest.outcome }}
          CHECK_REPLAY: ${{ steps.replay.outcome }}
          CHECK_BASELINE: ${{ steps.baseline.outcome }}
          CHECK_HEALER: ${{ steps.healer.outcome }}
          CHECK_DRAFT_PR: ${{ steps.draft_pr.outcome }}
        run: python scripts/build_dashboard_data.py

      - name: Package public dashboard
        id: dashboard
        if: ${{ !cancelled() && steps.dashboard_data.outcome == 'success' }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: reports/pages

    outputs:
      dashboard_ready: ${{ steps.dashboard.outcome }}

  publish-dashboard:
    needs: validate-and-replay
    if: ${{ !cancelled() && needs.validate-and-replay.outputs.dashboard_ready == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: driftguard-pages
      cancel-in-progress: false
    steps:
      - name: Check that the snapshot belongs to current main
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$GITHUB_SHA" = "$head_sha" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy dashboard
        id: deploy
        if: steps.current.outputs.publish == 'true'
        uses: actions/deploy-pages@v4
