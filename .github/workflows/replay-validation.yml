name: DriftGuard Replay Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  validate-and-replay:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Sigma rules
        run: sigma check --fail-on-issues rules/

      - name: Run Rule #1 Log Replay
        id: replay
        continue-on-error: true
        run: python scripts/replay_rule_01.py

      - name: Run Cloudflare Workers AI Drift Healer
        if: steps.replay.outcome == 'failure' && !startsWith(github.head_ref, 'driftguard/heal-')
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_GATEWAY_ID: ${{ secrets.CLOUDFLARE_GATEWAY_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python scripts/ai_healer.py

      - name: Open Draft PR with Verified Sigma Patch
        if: steps.replay.outcome == 'failure' && !startsWith(github.head_ref, 'driftguard/heal-')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="driftguard/heal-${{ github.run_id }}"
          git config user.name "DriftGuard Bot"
          git config user.email "driftguard-bot@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add rules/windows/proc_creation_encoded_powershell.yml
          git commit -m "fix(drift): auto-healed Rule #1 encoded PowerShell detection"
          git push origin "$BRANCH"
          gh pr create \
            --draft \
            --base main \
            --head "$BRANCH" \
            --title "DriftGuard AI Fix: Repair drifted Rule #1 (T1059.001)" \
            --body-file reports/drift_fix_summary.md

      - name: Enforce original validation status
        if: steps.replay.outcome == 'failure'
        run: |
          echo "Original rule failed replay validation. Review the DriftGuard Draft PR to heal it."
          exit 1