name: Cloudflare gateway controls
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/verify_gateway.py, .github/workflows/gateway-proof.yml]
permissions:
  contents: read
concurrency:
  group: driftguard-gateway-proof
  cancel-in-progress: false
jobs:
  measure:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Test synthetic DLP, cache and rate-limit responses
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_GATEWAY_ID: ${{ secrets.CLOUDFLARE_GATEWAY_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python scripts/verify_gateway.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gateway-proof
          path: reports/gateway-proof.json
