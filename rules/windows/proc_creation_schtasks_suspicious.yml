title: Suspicious Scheduled Task Creation via Schtasks
id: 4c8e2f1a-7b3d-4e92-a615-8d2f9c4e1b73
status: test
description: Detects schtasks.exe creating scheduled tasks that reference scripting engines, LOLBins, or user-writable paths commonly abused for persistence.
author: DriftGuard
date: 2026-11-26
tags:
  - attack.persistence
  - attack.execution
  - attack.t1053.005
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith:
      - '\schtasks.exe'
  selection_create:
    CommandLine|contains:
      - '/create'
      - '-create'
  selection_suspicious:
    CommandLine|contains:
      - '\Users\Public\'
      - '\AppData\'
      - '\Temp\'
      - 'wmic'
      - 'powershell'
      - 'pwsh'
      - 'cmd.exe'
      - 'mshta'
      - 'rundll32'
      - 'regsvr32'
      - 'http://'
      - 'https://'
  condition: selection_img and selection_create and selection_suspicious
falsepositives:
  - Legitimate administrative or software installer tasks running scripts from temporary or user directories
level: high