title: Suspicious Encoded PowerShell Command Execution
id: 9b2c1a4e-5f32-4c11-9d8a-7e6f5c4b3a21
status: test
description: Detects PowerShell execution with encoded command-line parameters used to obfuscate commands.
author: DriftGuard
date: 2026-11-26
tags:
  - attack.execution
  - attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
  selection_flags:
    CommandLine|contains:
      - ' -legacy_broken_flag '
  condition: selection_img and selection_flags
falsepositives:
  - Legitimate administrative or software deployment scripts using encoded commands
level: high