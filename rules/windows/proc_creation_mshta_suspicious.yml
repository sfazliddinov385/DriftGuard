title: Suspicious Mshta Proxy Execution
id: 7d3f9b2c-8e41-4a5d-9c12-6f8a3e5b2d91
status: test
description: Detects mshta.exe executing inline script protocols, remote URLs, or HTA payloads from user-writable directories while excluding routine COM embedding.
author: DriftGuard
date: 2026-11-26
tags:
  - attack.defense-evasion
  - attack.t1218.005
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith:
      - '\mshta.exe'
  selection_suspicious:
    CommandLine|contains:
      - 'javascript:'
      - 'vbscript:'
      - 'about:'
      - 'http://'
      - 'https://'
      - '\AppData\'
      - '\Temp\'
      - '\Users\Public\'
      - '\ProgramData\'
  condition: selection_img and selection_suspicious
falsepositives:
  - Legitimate internal HTA utilities launched from shared or temporary directories
level: high