# Fixed reference for testing the validator when the deployed rule is broken.
title: Encoded PowerShell Guardrail Control
id: e7a44bd0-89cf-4f47-aedf-b5c8ca34c8ba
status: test
description: Detects PowerShell execution with encoded command-line parameters used to obfuscate commands.
author: DriftGuard
date: 2026-11-26
tags:
  - attack.execution
  - attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
  selection_flags:
    CommandLine|contains:
      - ' -enc '
      - ' -encodedcommand '
      - ' -ec '
      - ' -e '
      - ' /enc '
      - ' /e '
  condition: selection_img and selection_flags
falsepositives:
  - Legitimate administrative or software deployment scripts using encoded commands
level: high
